<!DOCTYPE html>
<html>
<head>
    <title>Lab 7 - Lab 6 refactorred to use Memoization</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <script type="importmap">
        {
                "imports" : {
                "react" : "https://esm.sh/react",
                "react-dom/client" : "https://esm.sh/react-dom/client"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.js"></script>

<script data-type="module" type="text/babel">
      
    import React, {useState, useEffect} from "react"
    import { createRoot } from "react-dom/client"

    class Book {
        constructor(title, author) {
            this.title = title
            this.author = author
        }

        toString() {
            return `${this.title}, by ${this.author}`
        }
    }

    class Film {
        constructor(name, genre, blurb) {
            this.name = name
            this.genre = genre
            this.blurb = blurb
        }

        toString() {
            return `${this.name} [${this.genre}], ${this.blurb}`
        }
    }


    function ItemsList({items , ordered}) { //descrutured object properties into variables
                                            //Will keep this to use the React.createElement rather than JSX
        if(items.length == 0 ){
            return <div>[no items]</div>
        }else {                            
                let tagName = ordered ? 'ol' : 'ul';
                return ( React.createElement(tagName,null,
                    items.map(
                        (item, idx) => 
                        React.createElement('li',{key : idx, title : item.toString()},item.toString()) // explicitly return the value
                    )
                )
            )
        }
    }
    
    function ItemsTable({items}){ // full object
        if(items.length == 0 ){
            return <div>[no items]</div>
        }else {
        return ( <table>
                        <thead>
                            <tr>
                                {
                                    Object.keys(items[0]).map((key)=> <th>{key}</th>)
                                }
                            </tr>
                        </thead>
                        <tbody>
                            {
                                items.map((item, idx) => 
                                <tr>
                                    {
                                        Object.keys(items[idx]).map((key)=>
                                        <td>{item[key]}</td>
                                    
                                        )
                                    }
                                </tr>
                            )
                            }
                        </tbody>
                    </table> 
                )
        }    
        }//end of ItemsTable

    

    const FooterPanel = React.memo(()=>{
        return(
            <>
                <hr/>
                <small>Page Rendered: {new Date().toLocaleTimeString()}</small>
                </>
        )
    })
    function LikePanel({tabular, setTablular}){
         const [likeCount, setLikeCount] = useState(0);
         
         useEffect(()=>{
            console.log(`Likes count set to ${likeCount} at ${new Date().toLocaleTimeString()}`)

            return () => {
                console.log('clean up effect 1')
            }
         },[likeCount])

        return(
          
            <div className='likePanel'>Like Count: <bold>{likeCount}</bold> 
                <button onClick={()=>setLikeCount(likeCount + 1)}>Like </button>
                <button onClick={()=>setLikeCount(0)}>Reset Likes</button> 
                <button onClick={()=>setTablular(!tabular)}>Toogle View </button>
                <FooterPanel />
            </div>
        
        )
    }    
    

    function Library (){
        const [tabular,setTabular] = useState(true);
        const [books, setBooks] = useState([]);
        const [films,setFilms] = useState([])
        const [isLoading, setIsLoading] = useState(false);

        useEffect(()=>{
            async function getData(){
                try {
                    setIsLoading(true)
                    const bookApi = 'https://shiny-acorn-v6vq9jjj9q6427j6-3000.app.github.dev/api/books';
                    const filmApi = 'https://shiny-acorn-v6vq9jjj9q6427j6-3000.app.github.dev/api/films';
                    const responseBook = await fetch(bookApi) 
                    const responseFilm = await fetch(filmApi)

                   if(!responseBook.ok ){
                        throw Error(responseBook.statusText)
                    }
                   const booksRaw = await responseBook.json();
                  
                    const bookClass = booksRaw.map((book) => {
                        //alert(book.title)
                        return new Book(book.title,book.author)
                    })
                    
                    if(!responseFilm.ok ){
                        throw Error(responseFilm.statusText)
                    }
                   const filmsRaw = await responseFilm.json();
                  
                    const filmClass = filmsRaw.map((film) => {
                        //alert(film.name)
                        return new Film(film.name,film.genre,film.blurb)
                    })

                    setFilms(filmClass)
                    setBooks(bookClass)
                    setIsLoading(false)
                        
                } catch (error) {
                    alert(error)
                   // console.log(error)
                }
            }
            getData();
        },[])
        
         const BookCount = React.useMemo(()=><h2>Book: [count {books.length}]</h2>,[books]
            )
         const FilmCount = React.useMemo(()=><h2>Film: [count {films.length}]</h2>,[films]
         )
        
        
        const View2 = () => tabular ?
                <>{BookCount}
                 <ItemsTable items = {books} />
                {FilmCount}
                <ItemsTable items = {films} /> 
                </>
                : <> {BookCount}
                <ItemsList items = {books} ordered = {true} />
                {FilmCount}
                <ItemsList items = {films} ordered = {false} />
                </>
                
       
        return (
            <div>
                <h1>My Library</h1>
                {
                    isLoading ? <p>Loading Data</p> :  <View2/>
                }
               
                <h1>Like My Library</h1>
                <LikePanel setTablular = {setTabular} tabular = {tabular} />
            </div>                                                                                                   
        )
    }
    
    function App(){


        return (
            <Library />
        )
    }

    const root = createRoot(document.getElementById('root'))
    root.render(<App/>)

    
</script>

</body>
</html>
