<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoizing a particular piece of content</title>
    <style>
        body { font-family: Consolas;}
        .panel {
            background: #0677bb; color: white; margin-top:10px; padding-left: 5px; padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id ="root"></div>
    <script type="importmap">
        {
            "imports":{
                "react" : "https://esm.sh/react",
                "react-dom/client" : "https://esm.sh/react-dom/client"
            }
        }
    </script>
     <script src="https://unpkg.com/@babel/standalone/babel.js"></script>

     <script data-type="module" type="text/babel">
        import React,{useState, useEffect} from "react"
        import {createRoot} from "react-dom/client"

        //a "normal" (not memoized) component - with a portion of child content taht is MEMOIZED
        function Panel({title, text}){
            
            //Cache a particular piece of content. Note the dependency array is empty
            //so there's nothing in here that can change
            //so there's nothing in to inhibit caching here
            const initialRender = React.useMemo(
                ()=> <div>Initial render at {new Date().toString()}</div>,[]
            )

            return (
                <div className="panel">
                    <h2>{title}</h2>
                    <div>Text: {text}</div>
                    {initialRender}
                    <div>Timestamp: {new Date().toString()}</div>
                </div>
            )
        }

        //A fully memoized component using shallow / default comparison rules for properties
        const MemoizedPanel = React.memo(Panel)

        //A memoized component with CUSTOM comparison function for properties
        const MemoizedPanelWithCustomComparisonFunction = React.memo(Panel,(prevProps, nextProps) => prevProps.text.length == nextProps.text.length)

        function App(){ 
            const [text, setText] = useState('')
            return (
                <>
                <input value={text} placeholder="Enter text here" onChange={e=> setText(e.target.value)} /> 
                <Panel title ="Normal Panel with memoized initial timestamp" text ={text}/>
                <MemoizedPanel title="Memoized Panel" text={text} />
                <MemoizedPanelWithCustomComparisonFunction title="Memoized panel  with custom coparison function" text={text} />
                </>
            )
        }

        const root = createRoot(document.getElementById('root'))
        root.render(<App/>)
     </script>


</body>
</html>
