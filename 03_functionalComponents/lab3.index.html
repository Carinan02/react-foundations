<!DOCTYPE html>
<html>
<head>
    <title>Lab 3 - Lab 2 refactorred to use functional components</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <script type="importmap">
        {
                "imports" : {
                "react" : "https://esm.sh/react",
                "react-dom/client" : "https://esm.sh/react-dom/client"
            }
        }
    </script>

<script type="module">
      
    import React from "react"
    import { createRoot } from "react-dom/client"

    class Book {
        constructor(title, author) {
            this.title = title
            this.author = author
        }

        toString() {
            return `${this.title}, by ${this.author}`
        }
    }

    class Film {
        constructor(name, genre, blurb) {
            this.name = name
            this.genre = genre
            this.blurb = blurb
        }

        toString() {
            return `${this.name} [${this.genre}], ${this.blurb}`
        }
    }

    const books = [
        new Book('Millennium', 'Stieg Larsson'),
        new Book('A Christmas Carol', 'Charles Dickens'),
        new Book('The Son', 'Jo Nesbo'),
    ]

    const films = [
        new Film('Airplane', 'Comedy', 'Classic plane spoof'),
        new Film('Skyfall', 'Adventure', 'Bond spy yarn'),
        new Film('Love Actually', 'RomCom', ' Hugh Grant playing Hugh Grant')
    ]
   
    function ItemsList({items , ordered}) { //descrutured object properties into variables
            let tagName = ordered ? 'ol' : 'ul';
            return React.createElement(tagName,null,
                items.map(
                    (item, idx) => 
                     React.createElement('li',{key : idx, title : item.toString()},item.toString()) // explicitly return the value
                )
            )
        }
    
    function ItemsTable(props){ // full object
        return React.createElement(
            'table',
            null,

            React.createElement(
                'thead',
                null,

                React.createElement(
                    'tr',
                    null,
                    Object.keys(props.items[0]).map((key)=>
                    React.createElement('th',null,key)
                    )
                    
                )
            ),

            React.createElement(
                'tbody',
                null,
                props.items.map(
                    (item, idx) => 
                    

                     React.createElement(
                    'tr',
                    null,
                    Object.keys(props.items[idx]).map((key)=>
                    React.createElement('td',null,item[key])
                    )
                )
                )
            )
        );
}
    function App (){
       return React.createElement('div',null,
            React.createElement('h1',null,'My Library'),
            React.createElement('h2',null,'Books list'),
            React.createElement(ItemsList,{items: books, ordered : true}),
            React.createElement('h2',null,'Films list'),
            React.createElement(ItemsList,{items: films, ordered : false}),
            React.createElement('h2',null,'Books table'),
            React.createElement(ItemsTable,{items: books}),
            React.createElement('h2',null,'Films table'),
            React.createElement(ItemsTable,{items: films}),
           )
        }
    
    const app = React.createElement(App);
    const root = createRoot(document.getElementById('root'))
    root.render(app)

    
</script>

</body>
</html>
