<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-driven JSX</title>
    <!--JSX elements can create data-driven UI content
        use {} to enclose js code
    -->
</head>
<body>
    <div id ="root"></div>
    <script type="importmap">
        {
            "imports" :{
                "react" : "https://esm.sh/react",
                "react-dom/client" : "https://esm.sh/react-dom/client"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!--Note that the data- prefix is a standard JavaScript technique to add custom attributes.  -->
    <!-- This enables us to effectively set the "type" attribute twice, to "module" and "text/babel"-->
    <script data-type="module" type="text/babel">
        import React from "react"
        import { createRoot } from "react-dom/client";

        const data = ["Swansea shirt","cardiff Shirt","Lamborghini"]
        
        function ItemList(){
            const timestamp = new Date().toLocaleTimeString()
            return (
                <div>
                    <h1>JSX Example 1</h1>
                    <ul>
                        {
                            data.map((item,i) => <li key={i}>{item}</li>)
                        }
                    </ul>
                    <hr/>
                    <small>Page generated at {timestamp}</small>
                </div>
            )
        }
        const root = createRoot(document.getElementById('root'));
        root.render(<ItemList/>) //babel will transpile this and call the React.createElement method
    </script>
</body>
</html>
