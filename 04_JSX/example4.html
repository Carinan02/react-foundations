<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passing Properties to a component via JSX</title>
    <!--JSX elements can create data-driven UI content
        use {} to enclose js code
    -->
</head>
<body>
    <div id ="root"></div>
    <script type="importmap">
        {
            "imports" :{
                "react" : "https://esm.sh/react",
                "react-dom/client" : "https://esm.sh/react-dom/client"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!--Note that the data- prefix is a standard JavaScript technique to add custom attributes.  -->
    <!-- This enables us to effectively set the "type" attribute twice, to "module" and "text/babel"-->
    <script data-type="module" type="text/babel">
        import React from "react"
        import { createRoot } from "react-dom/client";

        const data = ["Swansea shirt","cardiff Shirt","Lamborghini"]
        
        function ItemsList(props){ //full object received
            return (
                <div>
                    <h1>{props.heading}</h1>
                    <ul>
                        {
                            props.items.map((item,i) => <li key={i}>{item}</li>)
                        }
                    </ul>
                    <hr/>
                    <small>Page generated at {props.timestamp}</small>
                </div>
            )
        }
        // Alternative implementation of ItemsList using destructuring
        function ItemsList2({heading, items, timestamp}){
            return(
                <div>
                    <h1>{heading}</h1>
                    <ul>
                        {
                            items.map((item,i) => <li key={i}>{item} </li>)
                        }
                    </ul>
                    <hr/>
                    <small>Page generated at {timestamp}</small>
                </div>
            )
        }
        const root = createRoot(document.getElementById('root'));
        root.render(<ItemsList2 heading={'JSX Example 4'} items= {data} timestamp = {new Date().toLocaleTimeString()} />) //babel will transpile this and call the React.createElement method
    </script>
</body>
</html>
