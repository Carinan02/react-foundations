<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Management - Realistic Example</title>
    <style>
        .gallery{
            font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: fixed;
            width: 100%;
            left: 4%;
            -webkit-transform: translateX(-2%);
            transform: translate(-2%);
        }
        .largeImage{
            width: 94%;
        }
        .smallImage{
            width: 10%;
            margin-right: 2%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="importmap">
        {
            "imports" :{
                "react" : "https://esm.sh/react",
                "react-dom/client" : "https://esm.sh/react-dom/client"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.js"></script>
    <script data-type="module" type="text/babel">
        import React, {useState} from "react"
        import { createRoot } from "react-dom/client"

        const urls = [
            'alesund.jpg',
            'bronnoysud.jpg',
            'budapest.jpg',
            'capetown.jpg',
            'cork.jpg',
            'joburghadeda.jpg',
            'oslo.jpg',
            'singapore.jpg'];
        const baseAddress = "http://olsensoft.com/thumbnails";


        function App({baseAddress, urls}){
            const [selectedUrl, setSelectedUrl] = useState(undefined)

            const mainContent = selectedUrl ? <img src={baseAddress + '/'+ selectedUrl} className='largeImage' />
                                : <h2>No Image Selected </h2>
            return (
                <div className="gallery">
                    <div>
                        {
                            urls.map((url,i) => 
                            <img key={i} src={baseAddress + '/'+ url}
                            className='smallImage'
                            onClick={()=> setSelectedUrl(url)} />
                        )}
                    </div>
                    <div>{mainContent}</div>
                </div>
            )
        }

        const root = createRoot(document.getElementById('root'))
        root.render(<App baseAddress= {baseAddress} urls = {urls}/>)
    </script>
</body>
</html>
